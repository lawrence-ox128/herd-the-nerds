<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herd the Nerds — Club Night & Table Allocations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #1e293b; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = "https://ylyvqvhzbcuiydrdwrbr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlseXZxdmh6YmN1aXlkcmR3cmJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzAwNTUsImV4cCI6MjEwODcwNjA1NX0.2ZdKQ8LjOfnxQFsqKqItfs62WGg-qvSDQbldUxjPxpw";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const CLUB_ID = "00000000-0000-0000-0000-000000000001";

    function App() {
      // --- AUTH & USER PROFILE ---
      const [session, setSession] = useState(null);
      const [currentUser, setCurrentUser] = useState(null);
      const [users, setUsers] = useState([]);

      // --- DATA COLLECTIONS ---
      const [clubNights, setClubNights] = useState([]);
      const [systems, setSystems] = useState([]);
      const [selectedNightId, setSelectedNightId] = useState(null);
      const [bookings, setBookings] = useState([]);
      const [lfgPosts, setLfgPosts] = useState([]);

      // --- NAVIGATION & UI STATE ---
      const [activeTab, setActiveTab] = useState('tables'); // 'tables' | 'lfg' | 'admin'
      const [loading, setLoading] = useState(true);

      // --- NOTIFICATION FEED ---
      const [notificationFeed, setNotificationFeed] = useState([
        {
          id: 'n-init',
          time: '20:00',
          type: 'discord',
          target: '#arrange-a-game-40k',
          text: '🟢 Realtime Sync Online. Welcome to Herd the Nerds!'
        }
      ]);

      // --- MODALS STATE ---
      const [isBookModalOpen, setIsBookModalOpen] = useState(false);
      const [editingBooking, setEditingBooking] = useState(null);
      const [isLfgModalOpen, setIsLfgModalOpen] = useState(false);
      const [challengeTargetPost, setChallengeTargetPost] = useState(null);
      const [cancelModalBooking, setCancelModalBooking] = useState(null);
      const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [termsPreviewOpen, setTermsPreviewOpen] = useState(false);

      // --- LFG FILTERS ---
      const [lfgFilterNight, setLfgFilterNight] = useState('ALL');
      const [lfgFilterSystem, setLfgFilterSystem] = useState('ALL');

      // Helper: Dispatch local notification pill
      const pushNotification = (type, target, text) => {
        const timeStr = new Date().toTimeString().slice(0, 5);
        setNotificationFeed(prev => [
          { id: 'n-' + Date.now(), time: timeStr, type, target, text },
          ...prev.slice(0, 4)
        ]);
      };

      // 1. Supabase Auth Listener
      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session?.user) syncCurrentProfile(session.user);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session?.user) syncCurrentProfile(session.user);
          else {
            setCurrentUser(null);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      const syncCurrentProfile = async (user) => {
        const { data } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .maybeSingle();

        if (data) {
          setCurrentUser(data);
          setShowAuthModal(false);
        } else {
          setShowAuthModal(true);
        }
      };

      // 2. Load Core Data (Nights, Systems, Users, LFG Posts)
      const fetchInitialData = async () => {
        setLoading(true);
        const [nightsRes, sysRes, usersRes, lfgRes] = await Promise.all([
          supabase.from('club_nights').select('*').eq('club_id', CLUB_ID).order('event_date', { ascending: true }),
          supabase.from('game_systems').select('*').eq('club_id', CLUB_ID).order('name', { ascending: true }),
          supabase.from('profiles').select('*').order('display_name', { ascending: true }),
          supabase.from('lfg_posts').select('*').order('created_at', { ascending: false })
        ]);

        if (nightsRes.data && nightsRes.data.length > 0) {
          setClubNights(nightsRes.data);
          setSelectedNightId(prev => prev || nightsRes.data[0].id);
        }
        if (sysRes.data) setSystems(sysRes.data);
        if (usersRes.data) setUsers(usersRes.data);
        if (lfgRes.data) setLfgPosts(lfgRes.data);
        setLoading(false);
      };

      useEffect(() => {
        fetchInitialData();
      }, []);

      // 3. Load Bookings for Selected Night & Subscribe to Realtime
      const fetchBookings = async () => {
        if (!selectedNightId) return;
        const { data } = await supabase
          .from('table_bookings')
          .select(`
            *,
            game_system:game_systems(name, discord_channel),
            players:booking_players(*)
          `)
          .eq('club_night_id', selectedNightId)
          .order('table_number', { ascending: true });

        if (data) setBookings(data);
      };

      useEffect(() => {
        fetchBookings();

        const channel = supabase
          .channel('club-v2-full-realtime')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'table_bookings' }, fetchBookings)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'booking_players' }, fetchBookings)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'lfg_posts' }, async () => {
            const { data } = await supabase.from('lfg_posts').select('*').order('created_at', { ascending: false });
            if (data) setLfgPosts(data);
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'profiles' }, async () => {
            const { data } = await supabase.from('profiles').select('*').order('display_name', { ascending: true });
            if (data) setUsers(data);
          })
          .on('postgres_changes', { event: '*', schema: 'public', table: 'club_nights' }, async () => {
            const { data } = await supabase.from('club_nights').select('*').order('event_date', { ascending: true });
            if (data) setClubNights(data);
          })
          .subscribe();

        return () => supabase.removeChannel(channel);
      }, [selectedNightId]);

      // Helpers
      const activeClubNights = useMemo(() => clubNights.filter(n => n.status !== 'cancelled'), [clubNights]);
      const selectedNight = useMemo(() => activeClubNights.find(n => n.id === selectedNightId) || activeClubNights[0] || clubNights[0], [activeClubNights, clubNights, selectedNightId]);
      const isAdmin = currentUser?.role === 'committee_admin' || currentUser?.role === 'super_admin';

      const getUser = (id) => users.find(u => u.id === id) || { display_name: 'Former Member', discord_handle: null, attendance: 0 };
      const getSystemChannel = (sysName) => {
        const found = systems.find(s => s.name === sysName);
        return found ? found.discord_channel : '#general-games';
      };

      const getBookingsForNight = (nightId) => bookings.filter(b => b.club_night_id === nightId && b.status !== 'cancelled');
      const currentNightBookings = selectedNight ? bookings.filter(b => b.club_night_id === selectedNight.id && b.status !== 'cancelled') : [];
      const tablesBookedCount = currentNightBookings.length;
      const tablesRemaining = Math.max(0, (selectedNight?.total_tables || 12) - tablesBookedCount);
      const totalPlayersBookedTonight = currentNightBookings.reduce((acc, b) => acc + (b.players?.length || 0), 0);

      const getNextAvailableTableNumber = (nightId) => {
        const used = bookings.filter(b => b.club_night_id === nightId && b.status !== 'cancelled').map(b => b.table_number);
        const night = clubNights.find(n => n.id === nightId);
        for (let i = 1; i <= (night ? night.total_tables : 12); i++) {
          if (!used.includes(i)) return i;
        }
        return null;
      };

      // Incoming Challenges
      const myIncomingChallenges = useMemo(() => {
        if (!currentUser) return [];
        return bookings.filter(b =>
          b.status === 'pending_challenge' &&
          b.players?.some(p => p.player_id === currentUser.id && p.invite_status === 'invited_challenged')
        );
      }, [bookings, currentUser]);

      // --- ACTIONS: TABLE BOOKINGS ---
      const handleCreateTableBooking = async (formData) => {
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }

        const nextTableNum = getNextAvailableTableNumber(formData.nightId);
        if (!nextTableNum) {
          alert('All tables for this night are currently claimed!');
          return;
        }

        let tableStatus = 'open';
        const playersToInsert = [
          {
            player_id: currentUser.id,
            is_guest: false,
            guest_name: currentUser.display_name,
            invite_status: 'confirmed'
          }
        ];

        if (formData.joinType === 'already_matched' && formData.opponentId) {
          const oppUser = getUser(formData.opponentId);
          playersToInsert.push({
            player_id: formData.opponentId,
            is_guest: false,
            guest_name: oppUser.display_name,
            invite_status: 'confirmed'
          });
          if (playersToInsert.length >= Number(formData.maxPlayers)) tableStatus = 'confirmed';
        } else if (formData.joinType === 'bring_guest' && formData.guestName.trim()) {
          playersToInsert.push({
            player_id: null,
            is_guest: true,
            guest_name: `${formData.guestName.trim()} (Guest of ${currentUser.display_name.split(' ')[0]})`,
            brought_by: currentUser.id,
            invite_status: 'confirmed'
          });
          if (playersToInsert.length >= Number(formData.maxPlayers)) tableStatus = 'confirmed';
        }

        const { data: bookingData, error: bookingErr } = await supabase
          .from('table_bookings')
          .insert([{
            club_id: CLUB_ID,
            club_night_id: formData.nightId,
            table_number: nextTableNum,
            host_id: currentUser.id,
            game_system_id: formData.systemId,
            max_players: Number(formData.maxPlayers) || 2,
            game_notes: formData.notes,
            status: tableStatus
          }])
          .select()
          .single();

        if (bookingErr) {
          alert('Error booking table: ' + bookingErr.message);
          return;
        }

        const rowsWithId = playersToInsert.map(p => ({ ...p, booking_id: bookingData.id }));
        await supabase.from('booking_players').insert(rowsWithId);

        setIsBookModalOpen(false);
        setSelectedNightId(formData.nightId);
        fetchBookings();

        const sysChannel = getSystemChannel(formData.systemName);
        const seatsLeft = Number(formData.maxPlayers) - playersToInsert.length;

        if (seatsLeft > 0) {
          pushNotification('discord', sysChannel, `🟢 OPEN TABLE: ${currentUser.display_name} booked Table #${nextTableNum} for ${formData.systemName} with ${seatsLeft} open seat(s)!`);
        } else {
          pushNotification('quiet', 'Silent DB Save', `Table #${nextTableNum} pre-arranged. No Discord spam sent.`);
        }
      };

      const handleUpdateTableBooking = async (bookingId, updatedFields) => {
        await supabase
          .from('table_bookings')
          .update({
            game_system_id: updatedFields.systemId,
            max_players: Number(updatedFields.maxPlayers),
            game_notes: updatedFields.notes
          })
          .eq('id', bookingId);

        setEditingBooking(null);
        fetchBookings();
      };

      const handleJoinTable = async (bookingId, guestNameInput = null) => {
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }

        const isGuestPass = Boolean(guestNameInput);
        const nameToUse = isGuestPass
          ? `${guestNameInput} (Guest of ${currentUser.display_name.split(' ')[0]})`
          : currentUser.display_name;

        await supabase.from('booking_players').insert([{
          booking_id: bookingId,
          player_id: isGuestPass ? null : currentUser.id,
          is_guest: isGuestPass,
          guest_name: nameToUse,
          brought_by: isGuestPass ? currentUser.id : null,
          invite_status: 'confirmed'
        }]);

        fetchBookings();
      };

      const handleLeaveOrCancelClick = (booking) => {
        const isHost = booking.host_id === currentUser.id;
        const otherRealMembers = booking.players?.filter(p => p.player_id !== currentUser.id && !p.is_guest) || [];

        if (isHost && otherRealMembers.length > 0) {
          setCancelModalBooking(booking);
        } else if (isHost && otherRealMembers.length === 0) {
          supabase.from('table_bookings').delete().eq('id', booking.id).then(fetchBookings);
        } else {
          supabase.from('booking_players')
            .delete()
            .eq('booking_id', booking.id)
            .or(`player_id.eq.${currentUser.id},brought_by.eq.${currentUser.id}`)
            .then(fetchBookings);
        }
      };

      const handleConfirmTransferOwnership = async (bookingId, newHostId) => {
        await supabase.from('table_bookings').update({ host_id: newHostId, status: 'open' }).eq('id', bookingId);
        await supabase.from('booking_players')
          .delete()
          .eq('booking_id', bookingId)
          .or(`player_id.eq.${currentUser.id},brought_by.eq.${currentUser.id}`);

        setCancelModalBooking(null);
        fetchBookings();
      };

      const handleConfirmWipeTable = async (bookingId) => {
        await supabase.from('table_bookings').delete().eq('id', bookingId);
        setCancelModalBooking(null);
        fetchBookings();
      };

      // --- ACTIONS: NOTICE BOARD (LFG) ---
      const handleIssueChallenge = async ({ post, nightId, systemId, systemName, notes }) => {
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }

        const nextTableNum = getNextAvailableTableNumber(nightId);
        if (!nextTableNum) {
          alert('No tables left on that date!');
          return;
        }

        const challengee = getUser(post.user_id);
        const { data: bookingData, error: bErr } = await supabase
          .from('table_bookings')
          .insert([{
            club_id: CLUB_ID,
            club_night_id: nightId,
            table_number: nextTableNum,
            host_id: currentUser.id,
            game_system_id: systemId,
            max_players: 2,
            game_notes: notes || `Notice Board Challenge vs ${challengee.display_name}`,
            status: 'pending_challenge'
          }])
          .select()
          .single();

        if (bErr) {
          alert('Error sending challenge: ' + bErr.message);
          return;
        }

        await supabase.from('booking_players').insert([
          { booking_id: bookingData.id, player_id: currentUser.id, is_guest: false, guest_name: currentUser.display_name, invite_status: 'confirmed' },
          { booking_id: bookingData.id, player_id: post.user_id, is_guest: false, guest_name: challengee.display_name, invite_status: 'invited_challenged' }
        ]);

        setChallengeTargetPost(null);
        fetchBookings();

        const channel = getSystemChannel(systemName);
        pushNotification('discord', channel, `⚔️ CHALLENGE: ${currentUser.display_name} challenged ${challengee.display_name} to ${systemName} on Table #${nextTableNum}!`);
      };

      const handleRespondToChallenge = async (bookingId, accept) => {
        if (accept) {
          await supabase.from('table_bookings').update({ status: 'confirmed' }).eq('id', bookingId);
          await supabase.from('booking_players')
            .update({ invite_status: 'confirmed' })
            .eq('booking_id', bookingId)
            .eq('player_id', currentUser.id);
        } else {
          await supabase.from('table_bookings').delete().eq('id', bookingId);
        }
        fetchBookings();
      };

      const handleCreateLfgPost = async (postData) => {
        if (!currentUser) {
          setShowAuthModal(true);
          return;
        }

        await supabase.from('lfg_posts').insert([{
          club_id: CLUB_ID,
          user_id: currentUser.id,
          available_night_ids: postData.availableNightIds,
          games: postData.games,
          vibe: postData.vibe,
          notes: postData.notes
        }]);

        setIsLfgModalOpen(false);
        const { data } = await supabase.from('lfg_posts').select('*').order('created_at', { ascending: false });
        if (data) setLfgPosts(data);
      };

      const handleDeleteLfgPost = async (postId) => {
        await supabase.from('lfg_posts').delete().eq('id', postId);
        setLfgPosts(prev => prev.filter(p => p.id !== postId));
      };

      // --- ACTIONS: COMMITTEE & GDPR ---
      const handleToggleAttendance = async (bookingId, playerId) => {
        const booking = bookings.find(b => b.id === bookingId);
        const player = booking?.players?.find(p => p.player_id === playerId);
        if (!player) return;

        const nextVal = !player.attended;
        await supabase.from('booking_players').update({ attended: nextVal }).eq('id', player.id);

        const delta = nextVal ? 1 : -1;
        const targetUser = users.find(u => u.id === playerId);
        if (targetUser) {
          const newAtt = Math.max(0, (targetUser.attendance || 0) + delta);
          await supabase.from('profiles').update({ attendance: newAtt }).eq('id', playerId);
        }
        fetchBookings();
      };

      const handleAdminMoveDate = async (nightId, newLabel, newNotes) => {
        await supabase.from('club_nights').update({ label: newLabel, notes: newNotes }).eq('id', nightId);
        fetchInitialData();
        pushNotification('discord', '#club-announcements', `📢 DATE MOVE: Club night updated to ${newLabel}. Bookings transferred!`);
      };

      const handleAdminCancelDate = async (nightId) => {
        await supabase.from('club_nights').update({ status: 'cancelled' }).eq('id', nightId);
        await supabase.from('table_bookings').delete().eq('club_night_id', nightId);
        fetchInitialData();
      };

      const handleDeleteProfile = async (userId) => {
        await supabase.from('profiles').delete().eq('id', userId);
        if (currentUser?.id === userId) {
          await supabase.auth.signOut();
        }
        fetchInitialData();
      };

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 text-amber-400 font-bold">
            Connecting to Herd the Nerds Live Database...
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* TARGETED DISCORD & EMAIL OUTBOUND FEED */}
          <div className="bg-slate-900/95 border-b border-slate-800 px-4 py-2 text-xs">
            <div className="max-w-7xl mx-auto flex items-center gap-3 overflow-x-auto custom-scrollbar">
              <div className="flex items-center gap-1.5 shrink-0 text-xs font-semibold text-amber-400 bg-amber-500/10 border border-amber-500/30 px-2.5 py-1 rounded-md">
                <span>📡 Smart Outbound Router (Per-System Discord + Email)</span>
              </div>
              {notificationFeed[0] && (
                <div className="text-xs text-slate-300 truncate flex items-center gap-2">
                  <span className="text-slate-500 font-mono">[{notificationFeed[0].time}]</span>
                  <span className={`px-2 py-0.5 rounded font-bold text-[11px] ${
                    notificationFeed[0].type === 'discord'
                      ? 'bg-[#5865F2]/20 text-[#5865F2] border border-[#5865F2]/40'
                      : 'bg-emerald-500/20 text-emerald-300 border border-emerald-500/40'
                  }`}>
                    {notificationFeed[0].target}
                  </span>
                  <span>{notificationFeed[0].text}</span>
                </div>
              )}
            </div>
          </div>

          {/* MAIN HEADER */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-20">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20">
                  🦬
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    Herd the Nerds
                    <span className="text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                      ● Live Sync
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">Club Night Table Allocations & Matchmaking</p>
                </div>
              </div>

              {/* Navigation Pills */}
              <div className="flex items-center gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('tables')}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 ${
                    activeTab === 'tables' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  <span>📅 Book a Table</span>
                  <span className={`text-xs px-1.5 py-0.5 rounded-full ${activeTab === 'tables' ? 'bg-slate-950/20 text-slate-950 font-bold' : 'bg-slate-800 text-slate-400'}`}>
                    {tablesRemaining} left
                  </span>
                </button>

                <button
                  onClick={() => setActiveTab('lfg')}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 ${
                    activeTab === 'lfg' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  <span>⚔️ Find a Buddy (LFG)</span>
                  <span className={`text-xs px-1.5 py-0.5 rounded-full ${activeTab === 'lfg' ? 'bg-slate-950/20 text-slate-950 font-bold' : 'bg-slate-800 text-slate-400'}`}>
                    {lfgPosts.length}
                  </span>
                </button>

                {isAdmin && (
                  <button
                    onClick={() => setActiveTab('admin')}
                    className={`px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 ${
                      activeTab === 'admin' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:text-white'
                    }`}
                  >
                    <span>🛡️ Committee Admin</span>
                  </button>
                )}
              </div>

              {/* User Profile Pill */}
              {currentUser ? (
                <button
                  onClick={() => setIsProfileModalOpen(true)}
                  className="flex items-center gap-3 bg-slate-950 hover:bg-slate-800/80 border border-slate-800 px-3.5 py-2 rounded-xl transition text-left"
                >
                  <div>
                    <div className="text-xs font-bold text-white flex items-center gap-1.5">
                      <span>👤 {currentUser.display_name}</span>
                      {currentUser.discord_handle && (
                        <span className="text-[10px] bg-[#5865F2]/20 text-[#5865F2] border border-[#5865F2]/40 px-1.5 py-0.2 rounded">
                          {currentUser.discord_handle}
                        </span>
                      )}
                      {isAdmin && (
                        <span className="text-[10px] bg-amber-500/20 text-amber-300 border border-amber-500/40 px-1.5 py-0.2 rounded font-bold">
                          ADMIN
                        </span>
                      )}
                    </div>

    // --- COMPONENT: ONBOARDING & T&CS GATE MODAL ---
    function OnboardingAuthModal({ session, onClose, onProfileSaved }) {
      const [authMethod, setAuthMethod] = useState('discord');
      const [inputEmail, setInputEmail] = useState('');
      const [inputName, setInputName] = useState(session?.user?.user_metadata?.custom_claims?.global_name || '');
      const [inputDiscord, setInputDiscord] = useState(session?.user?.user_metadata?.custom_claims?.preferred_username || '');
      const [termsAccepted, setTermsAccepted] = useState(false);
      const [emailAlerts, setEmailAlerts] = useState(true);
      const [submitting, setSubmitting] = useState(false);

      const handleDiscord = async () => {
        if (!termsAccepted) {
          alert('Please tick the Terms & Conditions checkbox before connecting with Discord.');
          return;
        }
        await supabase.auth.signInWithOAuth({
          provider: 'discord',
          options: { redirectTo: window.location.origin }
        });
      };

      const handleSubmit = async (e) => {
        e.preventDefault();
        if (!termsAccepted) {
          alert('You must accept the Terms & Conditions to proceed.');
          return;
        }

        setSubmitting(true);

        if (!session) {
          localStorage.setItem('pending_display_name', inputName);
          localStorage.setItem('pending_discord_handle', inputDiscord);
          const { error } = await supabase.auth.signInWithOtp({
            email: inputEmail,
            options: { emailRedirectTo: window.location.origin }
          });
          setSubmitting(false);
          if (error) alert(error.message);
          else alert(`Login link sent to ${inputEmail}! Check your inbox.`);
          return;
        }

        const { data, error } = await supabase.from('profiles').upsert([{
          id: session.user.id,
          club_id: CLUB_ID,
          display_name: inputName,
          discord_handle: inputDiscord.startsWith('@') ? inputDiscord : `@${inputDiscord}`,
          email_notifications: emailAlerts,
          role: 'member',
          accepted_terms_at: new Date().toISOString()
        }]).select().single();

        setSubmitting(false);
        if (error) alert(error.message);
        else onProfileSaved(data);
      };

      return (
        <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl relative">
            <button onClick={onClose} className="absolute top-5 right-5 text-slate-400 hover:text-white">✕</button>
            <div className="border-b border-slate-800 pb-3">
              <h3 className="text-xl font-bold text-white">👋 Welcome to Herd the Nerds!</h3>
              <p className="text-xs text-slate-400 mt-1">First-Time Member Onboarding & Data Protection Agreement</p>
            </div>
            <form onSubmit={handleSubmit} className="space-y-4 text-xs">
              {!session && (
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-400 mb-1.5">1. Choose Sign-In Method</label>
                  <div className="grid grid-cols-2 gap-2">
                    <button type="button" onClick={handleDiscord} className="py-2.5 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">
                      💬 Continue with Discord
                    </button>
                    <button type="button" onClick={() => setAuthMethod('email')} className={`py-2.5 px-3 rounded-xl border font-semibold ${authMethod === 'email' ? 'bg-slate-800 border-amber-500 text-amber-400' : 'bg-slate-950 border-slate-800 text-slate-400'}`}>
                      ✉️ Sign Up with Email
                    </button>
                  </div>
                  {authMethod === 'email' && (
                    <div className="pt-2">
                      <label className="block text-slate-300 font-medium mb-1">Email Address</label>
                      <input required type="email" value={inputEmail} onChange={(e) => setInputEmail(e.target.value)} placeholder="you@example.com" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white" />
                    </div>
                  )}
                </div>
              )}

              <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-400 mb-1">Display Name</label>
                  <input required type="text" value={inputName} onChange={(e) => setInputName(e.target.value)} placeholder="e.g. Roboute Guilliman" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white" />
                </div>
                <div>
                  <label className="block text-xs font-bold uppercase text-slate-400 mb-1">Discord Handle</label>
                  <input required type="text" value={inputDiscord} onChange={(e) => setInputDiscord(e.target.value)} placeholder="@username" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white" />
                </div>
              </div>

              <div className="bg-slate-950 p-3 rounded-xl border border-slate-800 max-h-32 overflow-y-auto custom-scrollbar text-[11px] text-slate-400 space-y-1.5">
                <div className="font-bold text-amber-400 uppercase">Herd the Nerds — Terms of Use & UK GDPR Notice</div>
                <p>1. Data We Collect: Display Name, login identifier, and attendance count.</p>
                <p>2. How Used: Displayed on table cards and the LFG board so members can coordinate games.</p>
                <p>3. Right of Erasure: You may permanently erase your account at any time in Profile Settings.</p>
              </div>

              <label className="flex items-start gap-2 cursor-pointer">
                <input type="checkbox" checked={termsAccepted} onChange={(e) => setTermsAccepted(e.target.checked)} className="mt-0.5 accent-amber-500" />
                <span className="text-slate-300 text-[11px]">I agree to the Herd the Nerds Terms & Conditions and Data Protection Policy.</span>
              </label>

              <div className="flex justify-end gap-3 pt-2">
                <button type="button" onClick={onClose} className="px-4 py-2 text-slate-400 hover:text-white">Cancel</button>
                <button type="submit" disabled={submitting} className="px-5 py-2.5 rounded-xl bg-emerald-500 text-slate-950 font-bold shadow-lg">
                  {submitting ? 'Processing...' : '✓ Agree & Create My Profile'}
                </button>
              </div>
            </form>
          </div>
        </div>
      );
    }

    // --- COMPONENT: STANDALONE TERMS MODAL ---
    function TermsAndConditionsModal({ onClose }) {
      return (
        <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
          <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 space-y-4 shadow-2xl">
            <div className="flex items-center justify-between border-b border-slate-800 pb-3">
              <h3 className="text-lg font-bold text-amber-400">📜 Herd the Nerds — Terms & Data Protection</h3>
              <button onClick={onClose} className="text-slate-400 hover:text-white text-sm">✕</button>
            </div>
            <div className="space-y-3 text-xs text-slate-300 leading-relaxed">
              <p><strong>1. Purpose:</strong> This app is operated by the committee to manage table allocations and help members arrange games.</p>
              <p><strong>2. Data Minimisation:</strong> Only Display Name, Email, Discord handle, and attendance are collected. No financial data.</p>
              <p><strong>3. Right to Erasure:</strong> Permanent 1-click self-deletion via profile settings.</p>
            </div>
            <div className="flex justify-end pt-3 border-t border-slate-800">
              <button onClick={onClose} className="px-5 py-2 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">Close</button>
            </div>
          </div>
        </div>
      );
    }

    // --- COMPONENT: COMMITTEE ADMIN PORTAL ---
    function AdminPortal({ clubNights, selectedNight, setSelectedNightId, currentNightBookings, users, getUser, systems, onToggleAttendance, onMoveDate, onCancelDate, onDeleteUser, onRefresh }) {
      const [newSysName, setNewSysName] = useState('');
      const [newSysChannel, setNewSysChannel] = useState('#arrange-a-game-');
      const [newNightLabel, setNewNightLabel] = useState('');
      const [newNightTables, setNewNightTables] = useState(12);

      const [editLabel, setEditLabel] = useState(selectedNight?.label || '');
      const [editNotes, setEditNotes] = useState(selectedNight?.notes || '');

      useEffect(() => {
        if (selectedNight) {
          setEditLabel(selectedNight.label);
          setEditNotes(selectedNight.notes);
        }
      }, [selectedNight]);

      const matrixRows = Array.from({ length: selectedNight?.total_tables || 12 }, (_, i) => {
        const tableNum = i + 1;
        const booking = currentNightBookings.find(b => b.table_number === tableNum);
        return { tableNum, booking };
      });

      const handleAddSystem = async (e) => {
        e.preventDefault();
        if (!newSysName.trim()) return;
        await supabase.from('game_systems').insert([{
          club_id: CLUB_ID,
          name: newSysName.trim(),
          default_players: 2,
          discord_channel: newSysChannel.trim() || '#general-games'
        }]);
        setNewSysName('');
        onRefresh();
      };

      const handleAddNight = async (e) => {
        e.preventDefault();
        if (!newNightLabel.trim()) return;
        await supabase.from('club_nights').insert([{
          club_id: CLUB_ID,
          event_date: '2026-12-24',
          label: newNightLabel.trim(),
          total_tables: Number(newNightTables) || 12,
          notes: 'Fortnightly Club Night (7:00 PM - 10:30 PM)',
          status: 'active'
        }]);
        setNewNightLabel('');
        onRefresh();
      };

      return (
        <div className="space-y-8">
          {/* Top Admin Header */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 rounded bg-amber-500/20 text-amber-300 border border-amber-500/30 text-xs font-bold">
                  Committee Admin View
                </span>
                <h2 className="text-xl font-bold text-white">Operations & Member Directory</h2>
              </div>
              <p className="text-xs text-slate-400 mt-1">Manage the table matrix, venue date overrides, and registered members.</p>
            </div>
            {selectedNight && (
              <div className="flex items-center gap-2">
                <label className="text-xs font-bold uppercase text-slate-400">Managing:</label>
                <select value={selectedNight.id} onChange={(e) => setSelectedNightId(e.target.value)} className="bg-slate-950 border border-amber-500/50 rounded-xl px-3.5 py-2 text-sm text-white font-bold">
                  {clubNights.map(n => <option key={n.id} value={n.id}>{n.label}</option>)}
                </select>
              </div>
            )}
          </div>

          {/* VENUE DATE CONTROLS */}
          {selectedNight && (
            <div className="bg-slate-900 border border-amber-500/30 rounded-2xl p-5 space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2">
                <div>
                  <h3 className="text-base font-bold text-amber-400">📅 Venue Date Controls for "{selectedNight.label}"</h3>
                  <p className="text-xs text-slate-400">Moving a date transfers all bookings and alerts affected players.</p>
                </div>
                <button onClick={() => { if (confirm(`CANCEL ${selectedNight.label}?`)) onCancelDate(selectedNight.id); }} className="px-4 py-2 rounded-xl bg-rose-950/70 text-rose-300 border border-rose-800 text-xs font-bold">
                  🚨 Cancel Date
                </button>
              </div>
              <div className="grid grid-cols-1 sm:grid-cols-3 gap-3 pt-2">
                <input type="text" value={editLabel} onChange={(e) => setEditLabel(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                <input type="text" value={editNotes} onChange={(e) => setEditNotes(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                <button onClick={() => onMoveDate(selectedNight.id, editLabel, editNotes)} className="py-2 px-4 rounded-xl bg-amber-500 text-slate-950 font-bold text-xs">
                  🔄 Save / Move Date
                </button>
              </div>
            </div>
          )}

          {/* 12-TABLE ATTENDANCE MATRIX */}
          {selectedNight && (
            <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
              <h3 className="text-base font-bold text-white">📋 Game Night Table & Attendance Matrix</h3>
              <div className="overflow-x-auto">
                <table className="w-full text-left border-collapse text-xs">
                  <thead>
                    <tr className="border-b border-slate-800 text-slate-400 uppercase tracking-wider text-[11px]">
                      <th className="py-3 px-3">Table #</th>
                      <th className="py-3 px-3">Status</th>
                      <th className="py-3 px-3">Game System</th>
                      <th className="py-3 px-3">Players & Attendance Check-In</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-800/70">
                    {matrixRows.map(({ tableNum, booking }) => {
                      if (!booking) {
                        return (
                          <tr key={tableNum} className="bg-slate-950/30 text-slate-500">
                            <td className="py-3 px-3 font-mono font-bold">Table #{tableNum}</td>
                            <td className="py-3 px-3"><span className="px-2 py-0.5 rounded bg-slate-900 border border-slate-800">Unclaimed</span></td>
                            <td className="py-3 px-3">—</td>
                            <td className="py-3 px-3 italic">Available for booking</td>
                          </tr>
                        );
                      }
                      return (
                        <tr key={tableNum} className="hover:bg-slate-950/40">
                          <td className="py-3 px-3 font-mono font-bold text-amber-400 align-top">Table #{tableNum}</td>
                          <td className="py-3 px-3 align-top">
                            <span className="px-2 py-0.5 rounded font-bold bg-emerald-500/20 text-emerald-300">
                              {booking.players?.length || 0}/{booking.max_players} Seated
                            </span>
                          </td>
                          <td className="py-3 px-3 font-bold text-white align-top">
                            <div>{booking.game_system?.name}</div>
                            {booking.game_notes && <div className="text-[11px] font-normal text-slate-400">{booking.game_notes}</div>}
                          </td>
                          <td className="py-3 px-3 align-top space-y-1.5">
                            {booking.players?.map(p => (
                              <div key={p.id} className="flex items-center justify-between bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-lg">
                                <span className="font-bold text-white mr-2">{p.guest_name}</span>
                                {!p.is_guest && (
                                  <label className="flex items-center gap-1.5 cursor-pointer">
                                    <input type="checkbox" checked={p.attended} onChange={() => onToggleAttendance(booking.id, p.player_id)} className="rounded accent-amber-500" />
                                    <span className={p.attended ? 'text-amber-400 font-bold' : 'text-slate-400'}>Attended (+1)</span>
                                  </label>
                                )}
                              </div>
                            ))}
                          </td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          )}

          {/* MASTER USER DIRECTORY */}
          <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-4">
            <h3 className="text-base font-bold text-white">👥 Master Member Directory ({users.length} Profiles)</h3>
            <div className="overflow-x-auto">
              <table className="w-full text-left border-collapse text-xs">
                <thead>
                  <tr className="border-b border-slate-800 text-slate-400 uppercase text-[11px]">
                    <th className="py-2.5 px-3">Member Name</th>
                    <th className="py-2.5 px-3">Discord Handle</th>
                    <th className="py-2.5 px-3">Role</th>
                    <th className="py-2.5 px-3">Attendances</th>
                    <th className="py-2.5 px-3 text-right">Action</th>
                  </tr>
                </thead>
                <tbody className="divide-y divide-slate-800/70">
                  {users.map(u => (
                    <tr key={u.id}>
                      <td className="py-2.5 px-3 font-bold text-white">{u.display_name}</td>
                      <td className="py-2.5 px-3 text-indigo-400">{u.discord_handle || '—'}</td>
                      <td className="py-2.5 px-3 uppercase text-[10px] font-bold text-amber-400">{u.role}</td>
                      <td className="py-2.5 px-3 font-bold text-amber-400">🏅 {u.attendance || 0}</td>
                      <td className="py-2.5 px-3 text-right">
                        <button onClick={() => { if (confirm(`Delete profile for ${u.display_name}?`)) onDeleteUser(u.id); }} className="px-2.5 py-1 rounded bg-rose-950/60 text-rose-300">
                          Delete
                        </button>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </div>

          {/* SYSTEMS & FUTURE DATES FORMS */}
          <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
            <form onSubmit={handleAddSystem} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
              <h4 className="text-sm font-bold text-white">➕ Add Game System & Discord Route</h4>
              <div className="grid grid-cols-2 gap-2">
                <input type="text" placeholder="System Name" value={newSysName} onChange={(e) => setNewSysName(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                <input type="text" placeholder="#channel-name" value={newSysChannel} onChange={(e) => setNewSysChannel(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-indigo-300 font-mono" />
              </div>
              <button type="submit" className="w-full py-2 rounded-xl bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-xs font-bold">Add System</button>
            </form>

            <form onSubmit={handleAddNight} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 space-y-3">
              <h4 className="text-sm font-bold text-white">📅 Unlock / Add Club Night Date</h4>
              <div className="grid grid-cols-3 gap-2">
                <input type="text" placeholder="e.g. Thu 7 Jan 2027" value={newNightLabel} onChange={(e) => setNewNightLabel(e.target.value)} className="col-span-2 bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
                <input type="number" value={newNightTables} onChange={(e) => setNewNightTables(e.target.value)} className="bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white" />
              </div>
              <button type="submit" className="w-full py-2 rounded-xl bg-slate-800 hover:bg-amber-500 hover:text-slate-950 text-xs font-bold">Add Date</button>
            </form>
          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
