<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Herd the Nerds — Club Night Booking System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0b1120; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
  </style>
</head>
<body class="min-h-screen bg-slate-950 text-slate-100 selection:bg-amber-500 selection:text-slate-950">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    const SUPABASE_URL = "https://ylyvqvhzbcuiydrdwrbr.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlseXZxdmh6YmN1aXlkcmR3cmJyIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMxMzAwNTUsImV4cCI6MjEwODcwNjA1NX0.2ZdKQ8LjOfnxQFsqKqItfs62WGg-qvSDQbldUxjPxpw";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    const CLUB_ID = "00000000-0000-0000-0000-000000000001";

    function App() {
      const [session, setSession] = useState(null);
      const [profile, setProfile] = useState(null);
      const [showAuthModal, setShowAuthModal] = useState(false);
      const [clubNights, setClubNights] = useState([]);
      const [systems, setSystems] = useState([]);
      const [selectedNightId, setSelectedNightId] = useState(null);
      const [bookings, setBookings] = useState([]);
      const [activeTab, setActiveTab] = useState('tables');
      const [loading, setLoading] = useState(true);

      // Onboarding / Sign-in form state
      const [authMethod, setAuthMethod] = useState('email'); // 'email' | 'discord'
      const [inputEmail, setInputEmail] = useState('');
      const [inputName, setInputName] = useState('');
      const [inputDiscord, setInputDiscord] = useState('');
      const [termsAccepted, setTermsAccepted] = useState(false);
      const [emailAlertsOptIn, setEmailAlertsOptIn] = useState(true);
      const [submittingAuth, setSubmittingAuth] = useState(false);

      // Modals
      const [isBookModalOpen, setIsBookModalOpen] = useState(false);

      // 1. Session & Profile Synchronization
      useEffect(() => {
        supabase.auth.getSession().then(({ data: { session } }) => {
          setSession(session);
          if (session?.user) syncProfile(session.user);
        });

        const { data: { subscription } } = supabase.auth.onAuthStateChange((_event, session) => {
          setSession(session);
          if (session?.user) syncProfile(session.user);
          else {
            setProfile(null);
          }
        });

        return () => subscription.unsubscribe();
      }, []);

      const syncProfile = async (user) => {
        const { data } = await supabase
          .from('profiles')
          .select('*')
          .eq('id', user.id)
          .maybeSingle();

        if (data) {
          setProfile(data);
          setShowAuthModal(false);
        } else {
          // User authenticated via magic link or Discord but needs to save profile & GDPR acceptance
          setInputEmail(user.email || '');
          setShowAuthModal(true);
        }
      };

      // 2. Load Club Nights & Game Systems
      const fetchInitialData = async () => {
        setLoading(true);
        const [nightsRes, sysRes] = await Promise.all([
          supabase.from('club_nights').select('*').eq('club_id', CLUB_ID).order('event_date', { ascending: true }),
          supabase.from('game_systems').select('*').eq('club_id', CLUB_ID).order('name', { ascending: true })
        ]);

        if (nightsRes.data && nightsRes.data.length > 0) {
          setClubNights(nightsRes.data);
          setSelectedNightId(prev => prev || nightsRes.data[0].id);
        }
        if (sysRes.data) setSystems(sysRes.data);
        setLoading(false);
      };

      useEffect(() => {
        fetchInitialData();
      }, []);

      // 3. Fetch Bookings for Selected Night & Setup Realtime Sync
      const fetchBookings = async () => {
        if (!selectedNightId) return;
        const { data } = await supabase
          .from('table_bookings')
          .select(`
            *,
            game_system:game_systems(name, discord_channel),
            players:booking_players(*)
          `)
          .eq('club_night_id', selectedNightId)
          .order('table_number', { ascending: true });

        if (data) setBookings(data);
      };

      useEffect(() => {
        fetchBookings();

        const channel = supabase
          .channel('realtime-tables-v2')
          .on('postgres_changes', { event: '*', schema: 'public', table: 'table_bookings' }, fetchBookings)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'booking_players' }, fetchBookings)
          .subscribe();

        return () => supabase.removeChannel(channel);
      }, [selectedNightId]);

      // Helpers
      const selectedNight = useMemo(() => clubNights.find(n => n.id === selectedNightId) || clubNights[0], [clubNights, selectedNightId]);
      const tablesRemaining = Math.max(0, (selectedNight?.total_tables || 12) - bookings.length);
      const isAdmin = profile?.role === 'committee_admin' || profile?.role === 'super_admin';

      const getNextAvailableTableNumber = () => {
        const used = bookings.map(b => b.table_number);
        for (let i = 1; i <= (selectedNight?.total_tables || 12); i++) {
          if (!used.includes(i)) return i;
        }
        return null;
      };

      // Handle Full Sign-Up / Onboarding Submission
      const handleCompleteOnboarding = async (e) => {
        e.preventDefault();
        if (!termsAccepted) {
          alert('You must accept the Terms & Conditions and Data Protection Policy to create an account.');
          return;
        }

        setSubmittingAuth(true);

        if (!session) {
          // Store entered profile info in localStorage so it persists through email redirect
          localStorage.setItem('pending_display_name', inputName);
          localStorage.setItem('pending_discord_handle', inputDiscord);
          localStorage.setItem('pending_email_alerts', String(emailAlertsOptIn));

          const { error } = await supabase.auth.signInWithOtp({
            email: inputEmail,
            options: { emailRedirectTo: window.location.origin }
          });

          setSubmittingAuth(false);
          if (error) {
            alert('Authentication error: ' + error.message);
          } else {
            alert(`A secure login link has been sent to ${inputEmail}! Open the link in your email to confirm your account.`);
            setShowAuthModal(false);
          }
          return;
        }

        // If session already exists, save profile to database
        const { data, error } = await supabase.from('profiles').upsert([{
          id: session.user.id,
          club_id: CLUB_ID,
          display_name: inputName,
          discord_handle: inputDiscord.startsWith('@') ? inputDiscord : `@${inputDiscord}`,
          email_notifications: emailAlertsOptIn,
          role: 'member',
          accepted_terms_at: new Date().toISOString()
        }]).select().single();

        setSubmittingAuth(false);
        if (error) {
          alert('Error saving profile: ' + error.message);
        } else {
          setProfile(data);
          setShowAuthModal(false);
        }
      };

      // Discord OAuth Handshake
      const handleDiscordSignIn = async () => {
        if (!termsAccepted) {
          alert('Please tick the Terms & Conditions checkbox before connecting with Discord.');
          return;
        }
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'discord',
          options: { redirectTo: window.location.origin }
        });
        if (error) alert('Discord login error: ' + error.message);
      };

      // Check for stored pending profile after magic-link callback
      useEffect(() => {
        if (session?.user && !profile) {
          const pendingName = localStorage.getItem('pending_display_name');
          const pendingDiscord = localStorage.getItem('pending_discord_handle');
          const pendingAlerts = localStorage.getItem('pending_email_alerts') === 'true';

          if (pendingName) {
            supabase.from('profiles').upsert([{
              id: session.user.id,
              club_id: CLUB_ID,
              display_name: pendingName,
              discord_handle: pendingDiscord ? (pendingDiscord.startsWith('@') ? pendingDiscord : `@${pendingDiscord}`) : '',
              email_notifications: pendingAlerts,
              role: 'member',
              accepted_terms_at: new Date().toISOString()
            }]).select().single().then(({ data }) => {
              if (data) {
                setProfile(data);
                setShowAuthModal(false);
                localStorage.removeItem('pending_display_name');
                localStorage.removeItem('pending_discord_handle');
                localStorage.removeItem('pending_email_alerts');
              }
            });
          }
        }
      }, [session, profile]);

      // Booking Action
      const handleCreateBooking = async ({ systemId, maxPlayers, notes, guestName }) => {
        if (!session || !profile) {
          setShowAuthModal(true);
          return;
        }

        const tableNum = getNextAvailableTableNumber();
        if (!tableNum) {
          alert('All tables for this night are currently claimed!');
          return;
        }

        const { data: bookingData, error: bookingErr } = await supabase
          .from('table_bookings')
          .insert([{
            club_id: CLUB_ID,
            club_night_id: selectedNight.id,
            table_number: tableNum,
            host_id: profile.id,
            game_system_id: systemId,
            max_players: Number(maxPlayers) || 2,
            game_notes: notes,
            status: guestName ? 'confirmed' : 'open'
          }])
          .select()
          .single();

        if (bookingErr) {
          alert('Error booking table: ' + bookingErr.message);
          return;
        }

        const playersToInsert = [
          {
            booking_id: bookingData.id,
            player_id: profile.id,
            is_guest: false,
            guest_name: `${profile.display_name} (Host)`,
            invite_status: 'confirmed'
          }
        ];

        if (guestName) {
          playersToInsert.push({
            booking_id: bookingData.id,
            is_guest: true,
            guest_name: `${guestName} (Guest)`,
            brought_by: profile.id,
            invite_status: 'confirmed'
          });
        }

        await supabase.from('booking_players').insert(playersToInsert);
        setIsBookModalOpen(false);
        fetchBookings();
      };

      const handleJoinTable = async (bookingId) => {
        if (!session || !profile) {
          setShowAuthModal(true);
          return;
        }

        await supabase.from('booking_players').insert([{
          booking_id: bookingId,
          player_id: profile.id,
          is_guest: false,
          guest_name: profile.display_name,
          invite_status: 'confirmed'
        }]);
        fetchBookings();
      };

      const handleCancelBooking = async (bookingId) => {
        if (!confirm('Are you sure you want to release this table back to the club?')) return;
        await supabase.from('table_bookings').delete().eq('id', bookingId);
        fetchBookings();
      };

      if (loading) {
        return (
          <div className="min-h-screen flex items-center justify-center bg-slate-950 text-amber-400 font-bold">
            Loading Herd the Nerds Portal...
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col">
          {/* HEADER */}
          <header className="bg-slate-900 border-b border-slate-800 sticky top-0 z-20">
            <div className="max-w-7xl mx-auto px-4 py-4 flex flex-col md:flex-row md:items-center md:justify-between gap-4">
              <div className="flex items-center gap-3">
                <div className="w-11 h-11 rounded-xl bg-gradient-to-br from-amber-500 to-orange-600 flex items-center justify-center text-slate-950 font-black text-xl shadow-lg shadow-amber-500/20">
                  🦬
                </div>
                <div>
                  <h1 className="text-xl font-bold tracking-tight text-white flex items-center gap-2">
                    Herd the Nerds
                    <span className="text-[11px] font-medium px-2 py-0.5 rounded-full bg-emerald-500/20 text-emerald-400 border border-emerald-500/40">
                      ● Live
                    </span>
                  </h1>
                  <p className="text-xs text-slate-400">Club Night Table Allocations & Matchmaking</p>
                </div>
              </div>

              {/* Navigation Tabs */}
              <div className="flex items-center gap-2 bg-slate-950 p-1.5 rounded-xl border border-slate-800">
                <button
                  onClick={() => setActiveTab('tables')}
                  className={`px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 ${
                    activeTab === 'tables' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:text-white'
                  }`}
                >
                  <span>📅 Tables</span>
                  <span className={`text-xs px-1.5 py-0.5 rounded-full ${activeTab === 'tables' ? 'bg-slate-950/20 text-slate-950 font-bold' : 'bg-slate-800 text-slate-400'}`}>
                    {tablesRemaining} left
                  </span>
                </button>

                {isAdmin && (
                  <button
                    onClick={() => setActiveTab('admin')}
                    className={`px-4 py-2 rounded-lg text-sm font-semibold transition flex items-center gap-2 ${
                      activeTab === 'admin' ? 'bg-amber-500 text-slate-950 shadow' : 'text-slate-300 hover:text-white'
                    }`}
                  >
                    <span>🛡️ Committee</span>
                  </button>
                )}
              </div>

              {/* Account / Login CTA */}
              <div>
                {session && profile ? (
                  <div className="flex items-center gap-3 bg-slate-950 border border-slate-800 px-3 py-1.5 rounded-xl text-xs">
                    <div>
                      <span className="font-bold text-amber-400">{profile.display_name}</span>
                      <span className="text-slate-500 ml-1">({profile.discord_handle})</span>
                      {isAdmin && <span className="ml-2 px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-bold text-[10px]">ADMIN</span>}
                    </div>
                    <button
                      onClick={() => supabase.auth.signOut()}
                      className="text-slate-400 hover:text-rose-400 font-bold ml-2 border-l border-slate-800 pl-2"
                    >
                      Log Out
                    </button>
                  </div>
                ) : (
                  <button
                    onClick={() => setShowAuthModal(true)}
                    className="px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold text-xs shadow-lg shadow-amber-500/20 transition"
                  >
                    Member Login / Sign Up
                  </button>
                )}
              </div>
            </div>
          </header>

          {/* MAIN VIEW */}
          <main className="flex-1 max-w-7xl w-full mx-auto px-4 py-6">
            {activeTab === 'tables' && selectedNight && (
              <div className="space-y-6">
                {/* Date Ribbon */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-4">
                  <h2 className="text-xs font-bold uppercase tracking-wider text-slate-400 mb-3">
                    Select Upcoming Club Night (Fortnightly Thursdays)
                  </h2>
                  <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    {clubNights.map(night => {
                      const isSelected = night.id === selectedNight.id;
                      return (
                        <button
                          key={night.id}
                          onClick={() => setSelectedNightId(night.id)}
                          className={`text-left p-3.5 rounded-xl border transition flex flex-col justify-between ${
                            isSelected
                              ? 'bg-amber-500/10 border-amber-500 ring-1 ring-amber-500/50'
                              : 'bg-slate-950/60 border-slate-800 hover:border-slate-700'
                          }`}
                        >
                          <span className={`font-bold text-sm ${isSelected ? 'text-amber-400' : 'text-white'}`}>
                            {night.label}
                          </span>
                          <p className="text-xs text-slate-400 mt-1 line-clamp-1">{night.notes}</p>
                        </button>
                      );
                    })}
                  </div>
                </div>

                {/* Capacity Summary & Book Action */}
                <div className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col sm:flex-row sm:items-center justify-between gap-4">
                  <div>
                    <h2 className="text-2xl font-extrabold text-white">{selectedNight.label}</h2>
                    <p className="text-xs text-slate-400 mt-1">
                      {selectedNight.notes} • <strong>{tablesRemaining} tables available</strong> for booking.
                    </p>
                  </div>
                  <button
                    onClick={() => {
                      if (!session || !profile) setShowAuthModal(true);
                      else setIsBookModalOpen(true);
                    }}
                    disabled={tablesRemaining === 0}
                    className="px-5 py-2.5 rounded-xl bg-amber-500 hover:bg-amber-400 disabled:opacity-50 text-slate-950 font-bold text-sm shadow-lg shadow-amber-500/20 transition"
                  >
                    ➕ Book a Club Table
                  </button>
                </div>

                {/* Tables Grid */}
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {bookings.map(b => {
                    const seatedCount = b.players?.length || 0;
                    const seatsLeft = Math.max(0, b.max_players - seatedCount);
                    const canManage = isAdmin || (profile && b.host_id === profile.id);
                    const alreadySeated = profile && b.players?.some(p => p.player_id === profile.id);

                    return (
                      <div key={b.id} className="bg-slate-900 border border-slate-800 rounded-2xl p-5 flex flex-col justify-between space-y-4">
                        <div>
                          <div className="flex items-center justify-between gap-2 mb-3">
                            <span className="px-2.5 py-1 rounded-lg bg-slate-950 text-amber-400 font-mono text-xs font-bold border border-slate-800">
                              Table #{b.table_number}
                            </span>
                            <span className="text-[11px] text-indigo-400 font-mono">
                              {b.game_system?.discord_channel}
                            </span>
                          </div>

                          <h4 className="text-lg font-bold text-white mb-2">{b.game_system?.name}</h4>

                          {b.game_notes && (
                            <p className="text-xs text-slate-300 bg-slate-950/60 p-2.5 rounded-lg border border-slate-800/80 mb-3">
                              "{b.game_notes}"
                            </p>
                          )}

                          <div className="space-y-1.5">
                            <div className="text-[11px] font-bold uppercase tracking-wider text-slate-400">
                              Players Seated ({seatedCount} / {b.max_players})
                            </div>
                            {b.players?.map((p, idx) => (
                              <div key={p.id || idx} className="bg-slate-950 px-3 py-1.5 rounded-lg border border-slate-800 text-xs flex justify-between">
                                <span className="font-semibold text-white">{p.guest_name}</span>
                                <span className="text-[10px] text-emerald-400 font-bold">Confirmed</span>
                              </div>
                            ))}
                            {Array.from({ length: seatsLeft }).map((_, i) => (
                              <div key={i} className="border border-dashed border-slate-800 px-3 py-1.5 rounded-lg text-xs text-slate-500">
                                Open Seat #{seatedCount + i + 1}
                              </div>
                            ))}
                          </div>
                        </div>

                        <div className="pt-3 border-t border-slate-800 flex gap-2">
                          {seatsLeft > 0 && !alreadySeated ? (
                            <button
                              onClick={() => handleJoinTable(b.id)}
                              className="flex-1 py-2 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs"
                            >
                              ➕ Join Table
                            </button>
                          ) : alreadySeated ? (
                            <span className="flex-1 text-center py-2 text-xs text-emerald-400 font-bold">You are seated</span>
                          ) : (
                            <span className="flex-1 text-center py-2 text-xs text-slate-500">Table Full</span>
                          )}

                          {canManage && (
                            <button
                              onClick={() => handleCancelBooking(b.id)}
                              className="px-3 py-2 rounded-xl bg-slate-800 hover:bg-rose-950 text-slate-400 hover:text-rose-300 text-xs"
                              title="Cancel / Release Table"
                            >
                              🗑️
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}

            {activeTab === 'admin' && isAdmin && (
              <div className="bg-slate-900 border border-slate-800 rounded-2xl p-6 space-y-4">
                <h3 className="text-lg font-bold text-white">🛡️ Committee Table Matrix</h3>
                <p className="text-xs text-slate-400">Full operational overview for {selectedNight?.label}:</p>
                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs border-collapse">
                    <thead>
                      <tr className="border-b border-slate-800 text-slate-400 uppercase">
                        <th className="p-2">Table</th>
                        <th className="p-2">Game System</th>
                        <th className="p-2">Notes</th>
                        <th className="p-2">Host & Seated Players</th>
                        <th className="p-2">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-800">
                      {bookings.map(b => (
                        <tr key={b.id}>
                          <td className="p-2 font-mono text-amber-400 font-bold">#{b.table_number}</td>
                          <td className="p-2 text-white font-bold">{b.game_system?.name}</td>
                          <td className="p-2 text-slate-400">{b.game_notes || '—'}</td>
                          <td className="p-2 text-slate-300">
                            {b.players?.map(p => p.guest_name).join(', ') || 'None'}
                          </td>
                          <td className="p-2">
                            <button
                              onClick={() => handleCancelBooking(b.id)}
                              className="px-2 py-1 rounded bg-rose-950 text-rose-300 text-[10px] font-bold"
                            >
                              Release
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              </div>
            )}
          </main>

          {/* ========================================================================= */}
          {/* THE PROTOTYPE ONBOARDING & T&CS MODAL RESTORED FULLY                      */}
          {/* ========================================================================= */}
          {showAuthModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/85 backdrop-blur-md flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700/80 rounded-2xl max-w-lg w-full p-6 sm:p-7 space-y-5 shadow-2xl relative">
                <button
                  onClick={() => setShowAuthModal(false)}
                  className="absolute top-5 right-5 text-slate-400 hover:text-white text-lg font-bold"
                >
                  ✕
                </button>

                <div className="border-b border-slate-800 pb-3">
                  <h3 className="text-xl font-extrabold text-white flex items-center gap-2">
                    <span>👋 Welcome to Herd the Nerds!</span>
                  </h3>
                  <p className="text-xs text-slate-400 mt-1">
                    First-Time Member Onboarding & Data Protection Agreement
                  </p>
                </div>

                <form onSubmit={handleCompleteOnboarding} className="space-y-4 text-xs">
                  {/* Step 1: Sign-in Options */}
                  {!session && (
                    <div className="space-y-2">
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400">
                        1. Choose Sign-In Method
                      </label>
                      <div className="grid grid-cols-2 gap-2">
                        <button
                          type="button"
                          onClick={handleDiscordSignIn}
                          className="flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl bg-indigo-600 hover:bg-indigo-500 text-white font-semibold transition"
                        >
                          <span>💬 Continue with Discord</span>
                        </button>
                        <button
                          type="button"
                          onClick={() => setAuthMethod('email')}
                          className={`flex items-center justify-center gap-2 py-2.5 px-3 rounded-xl border transition font-semibold ${
                            authMethod === 'email'
                              ? 'bg-slate-800 border-amber-500 text-amber-400'
                              : 'bg-slate-950/60 border-slate-800 text-slate-400'
                          }`}
                        >
                          <span>✉️ Sign Up with Email</span>
                        </button>
                      </div>

                      {authMethod === 'email' && (
                        <div className="pt-2">
                          <label className="block text-slate-300 font-medium mb-1">Email Address</label>
                          <input
                            required
                            type="email"
                            value={inputEmail}
                            onChange={(e) => setInputEmail(e.target.value)}
                            placeholder="you@example.com"
                            className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white focus:border-amber-500 focus:outline-none"
                          />
                        </div>
                      )}
                    </div>
                  )}

                  {/* Step 2: Display Profile Fields */}
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                        Display Name
                      </label>
                      <input
                        required
                        type="text"
                        value={inputName}
                        onChange={(e) => setInputName(e.target.value)}
                        placeholder="e.g. Roboute Guilliman"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white focus:border-amber-500 focus:outline-none"
                      />
                    </div>
                    <div>
                      <label className="block text-[11px] font-bold uppercase tracking-wider text-slate-400 mb-1">
                        Discord Handle
                      </label>
                      <input
                        required
                        type="text"
                        value={inputDiscord}
                        onChange={(e) => setInputDiscord(e.target.value)}
                        placeholder="@username"
                        className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white focus:border-amber-500 focus:outline-none"
                      />
                    </div>
                  </div>

                  {/* Step 3: Terms of Use & UK GDPR Notice */}
                  <div className="space-y-2">
                    <div className="bg-slate-950 p-3.5 rounded-xl border border-slate-800 max-h-36 overflow-y-auto custom-scrollbar text-[11px] text-slate-400 space-y-2">
                      <div className="font-bold text-amber-400 uppercase tracking-wide">
                        Herd the Nerds — Terms of Use & UK GDPR Data Protection Notice
                      </div>
                      <p>
                        <strong>1. Data We Collect:</strong> To manage club night table allocations and game pairings, Herd the Nerds stores only your chosen Display Name, your login identifier (Email address or Discord Username/ID), and your club attendance count.
                      </p>
                      <p>
                        <strong>2. How Your Data Is Used:</strong> Your Display Name and Discord handle (if applicable) are displayed on club table cards and the "Find a Buddy" notice board so other club members can arrange games with you. Your email address is strictly private and is never shared with third parties or visible to other members.
                      </p>
                      <p>
                        <strong>3. Communications & Opt-Out:</strong> If you use Email login, you will only receive transactional magic links and critical table update alerts that you opt into below.
                      </p>
                      <p>
                        <strong>4. Right of Deletion (GDPR):</strong> You may request the immediate deletion of your profile and data at any time via the club committee or self-service account removal.
                      </p>
                    </div>

                    {/* Checkboxes */}
                    <label className="flex items-start gap-2.5 cursor-pointer pt-1">
                      <input
                        type="checkbox"
                        checked={termsAccepted}
                        onChange={(e) => setTermsAccepted(e.target.checked)}
                        className="mt-0.5 rounded border-slate-700 text-amber-500 focus:ring-0"
                      />
                      <span className="text-slate-300 text-[11px] leading-relaxed">
                        I agree to the Herd the Nerds <strong>Terms & Conditions</strong> and <strong>Data Protection Policy</strong> (Required to create a profile).
                      </span>
                    </label>

                    <label className="flex items-start gap-2.5 cursor-pointer">
                      <input
                        type="checkbox"
                        checked={emailAlertsOptIn}
                        onChange={(e) => setEmailAlertsOptIn(e.target.checked)}
                        className="mt-0.5 rounded border-slate-700 text-amber-500 focus:ring-0"
                      />
                      <span className="text-slate-400 text-[11px] leading-relaxed">
                        Send me direct email alerts when I am challenged, my opponent drops out, or my booked club night date changes (You can mute this anytime).
                      </span>
                    </label>
                  </div>

                  {/* Actions */}
                  <div className="flex items-center justify-end gap-3 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowAuthModal(false)}
                      className="px-4 py-2.5 rounded-xl text-slate-400 hover:text-white font-medium transition"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={submittingAuth}
                      className="px-5 py-2.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 disabled:opacity-50 text-slate-950 font-bold shadow-lg shadow-emerald-500/20 transition flex items-center gap-1.5"
                    >
                      <span>✓</span>
                      <span>{submittingAuth ? 'Processing...' : 'Agree & Create My Profile'}</span>
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* BOOK TABLE MODAL */}
          {isBookModalOpen && (
            <div className="fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 space-y-4 shadow-2xl">
                <div className="flex justify-between items-center border-b border-slate-800 pb-2">
                  <h3 className="font-bold text-white">Book a Club Table</h3>
                  <button onClick={() => setIsBookModalOpen(false)}>✕</button>
                </div>
                <form onSubmit={(e) => {
                  e.preventDefault();
                  const fd = new FormData(e.target);
                  handleCreateBooking({
                    systemId: fd.get('systemId'),
                    maxPlayers: fd.get('maxPlayers'),
                    notes: fd.get('notes'),
                    guestName: fd.get('guestName')
                  });
                }} className="space-y-3 text-xs">
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Game System</label>
                    <select name="systemId" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white">
                      {systems.map(s => (
                        <option key={s.id} value={s.id}>{s.name} ({s.discord_channel})</option>
                      ))}
                    </select>
                  </div>
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Max Players</label>
                    <input type="number" name="maxPlayers" defaultValue={2} min={1} max={8} className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Game Notes / Points</label>
                    <input type="text" name="notes" placeholder="e.g. 2000pts Matched Play" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <div>
                    <label className="block text-slate-400 font-bold mb-1">Opponent or Non-Member Guest (Optional)</label>
                    <input type="text" name="guestName" placeholder="e.g. Tony (Guest)" className="w-full bg-slate-950 border border-slate-700 rounded-xl p-2.5 text-white" />
                  </div>
                  <button type="submit" className="w-full py-2.5 rounded-xl bg-amber-500 text-slate-950 font-bold">
                    Claim Table
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
